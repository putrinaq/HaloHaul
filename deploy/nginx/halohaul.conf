# Host Nginx site for HaloHaul on the NAT VPS. Install as
# /etc/nginx/sites-available/halohaul, symlink into sites-enabled, then
#   nginx -t && systemctl reload nginx
#
# The VPS shares its public IP. The provider's Caddy owns ports 80/443, issues
# the TLS certificate for the domain, and forwards plain HTTP to port 4000 here
# (set per domain in the provider's panel). The app itself is on 127.0.0.1:3000.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 4000;
    listen [::]:4000;
    server_name halohaul.putrinaqibah.com;

    server_tokens off;
    client_max_body_size 2m; # photos go straight to R2 via presigned URLs

    # Requests arrive from the provider's proxy, which sets X-Forwarded-For to
    # the real client. Trust it only from private ranges (the proxy), so
    # $remote_addr becomes the client IP for logs and Better Auth's rate limiter.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.r2.cloudflarestorage.com; connect-src 'self' https://*.r2.cloudflarestorage.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: Better Auth's rate limiter trusts this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # TLS ends at the provider's proxy.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 60s;
    }
}
