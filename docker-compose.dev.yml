# Local development database only. The app runs on the host with `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d
# DATABASE_URL=postgres://halohaul:halohaul@localhost:5432/halohaul

name: halohaul-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: halohaul
      POSTGRES_PASSWORD: halohaul
      POSTGRES_DB: halohaul
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
